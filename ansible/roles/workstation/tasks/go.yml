---
- name: Go | installed version
  ansible.builtin.command: /usr/local/go/bin/go env GOVERSION
  register: workstation_go
  changed_when: false
  failed_when: false

- name: Go | install {{ workstation_go_version }}
  when: workstation_go.stdout | default('') != 'go' ~ workstation_go_version
  become: true
  block:
    - name: Go | download and verify
      ansible.builtin.get_url:
        url: "https://dl.google.com/go/go{{ workstation_go_version }}.linux-amd64.tar.gz"
        checksum: "sha256:https://dl.google.com/go/go{{ workstation_go_version }}.linux-amd64.tar.gz.sha256"
        dest: /tmp/go.tar.gz
        mode: "0644"

    - name: Go | remove previous toolchain
      ansible.builtin.file:
        path: /usr/local/go
        state: absent

    - name: Go | extract
      ansible.builtin.unarchive:
        src: /tmp/go.tar.gz
        dest: /usr/local
        remote_src: true

    - name: Go | PATH for login shells
      ansible.builtin.copy:
        dest: /etc/profile.d/go.sh
        content: 'export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH'
        mode: "0644"
  always:
    - name: Go | clean archive
      become: true
      ansible.builtin.file:
        path: /tmp/go.tar.gz
        state: absent
