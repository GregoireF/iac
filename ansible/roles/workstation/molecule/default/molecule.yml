---
# Workstation role in a throw-away Debian trixie container (same base image as scripts/wsl/new-distro.ps1).
# Cluster roles (k3d_cluster, flux_bootstrap) are tested for real by .github/workflows/k8s-e2e.yml.
# Run: cd ansible/roles/workstation && molecule test   (or `just molecule`)
driver:
  name: docker
platforms:
  - name: iac-workstation
    # renovate: datasource=docker depName=debian
    image: "debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6"
    # Used as is: the driver's build step derives an image tag from `image`, which a digest breaks.
    # prepare.yml installs Python with `raw` instead.
    pre_build_image: true
    command: sleep infinity
provisioner:
  name: ansible
  env:
    # MOLECULE_PROJECT_DIRECTORY is the role directory; its parent is ansible/roles
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  inventory:
    host_vars:
      iac-workstation:
        # No Docker-in-Docker, no uv bootstrap: covered by the real distro bootstrap
        workstation_docker_enabled: false
        workstation_uv_tools: []
        # Default: one of each download style (checksum file, hash-only file, pinned hash + extra binary).
        # CI sets IAC_MOLECULE_BINARIES=all so every Renovate bump is installed and verified before merge.
        workstation_binaries_only: >-
          {{ [] if lookup('env', 'IAC_MOLECULE_BINARIES') == 'all'
             else (lookup('env', 'IAC_MOLECULE_BINARIES') | default('tofu,kubectl,age', true)).split(',') }}
verifier:
  name: ansible
