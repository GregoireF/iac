---
# The stock Debian image has no Python: bootstrap the minimum Ansible needs, like the WSL distro bootstrap does.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Python and sudo for Ansible
      ansible.builtin.raw: >-
        command -v python3 >/dev/null && command -v sudo >/dev/null ||
        (apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 sudo)
      changed_when: false
