name: "Request: release the repository module"
description: Tag a new version of modules/github/repository, then move terraform/github to it
title: "[request] module release"
labels: ["request:release"]
body:
  - type: dropdown
    id: bump
    attributes:
      label: Bump
      options: [patch, minor, major]
      default: 0
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What changed in the module (optional).
