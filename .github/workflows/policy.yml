# Policy-as-code gates (docs/ROADMAP.md):
# - OPA unit tests for the OpenTofu plan policies (policies/opentofu)
# - kubeconform: schema validation of every rendered Kubernetes manifest (Flux CRDs via the CRDs catalog)
# - Kyverno CLI: iac baseline policies on the rendered manifests
name: policy

on:
  pull_request:
    paths: ["policies/**", "kubernetes/**", "scripts/check-manifests.sh", ".github/workflows/policy.yml"]
  push:
    branches: [main]
    paths: ["policies/**", "kubernetes/**", "scripts/check-manifests.sh"]

permissions: {}

concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: "0.8.0" # renovate: datasource=github-releases depName=yannh/kubeconform
  KYVERNO_VERSION: "1.20.0" # renovate: datasource=github-releases depName=kyverno/kyverno

jobs:
  opa:
    name: OPA tests (OpenTofu plan policies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: "1.22.4" # renovate: datasource=github-releases depName=open-policy-agent/opa
      - run: opa test policies/opentofu -v

  manifests:
    name: kubeconform + Kyverno
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kubeconform and Kyverno CLI (checksums verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          kc=https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}
          curl -fsSLO "$kc/kubeconform-linux-amd64.tar.gz"
          curl -fsSL "$kc/CHECKSUMS" | grep ' kubeconform-linux-amd64.tar.gz$' | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          ky=https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}
          curl -fsSLO "$ky/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          curl -fsSL "$ky/checksums.txt" | grep " kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz$" | sha256sum -c -
          tar -xzf "kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz" kyverno
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Same script as `just k8s` (render deployed overlays, kubeconform, Kyverno)
      - name: Render and validate manifests
        run: scripts/check-manifests.sh
