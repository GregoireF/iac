# Every commit of a pull request follows the commit policy (scripts/check-commit-msg.sh):
# Conventional Commits, no co-author / generated-by trailer, the author's own DCO "Signed-off-by".
# Bots (Renovate, GitHub) are exempt from the format and sign-off, never from the trailer rule.
# Its job, "commit policy", is the required status check of this repository's ruleset.
name: commit-policy

on:
  pull_request:

permissions: {}

concurrency:
  group: commit-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: commit policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check every commit of the PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          fail=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an' "$sha")"
            git log -1 --format='%B' "$sha" > "$RUNNER_TEMP/msg"
            # bots (Renovate, GitHub) cannot sign off: trailer rule only; humans sign off as themselves
            args=(--author "$(git log -1 --format='%an <%ae>' "$sha")")
            [[ "$author" == *"[bot]" ]] && args=(--trailers-only)
            if ! scripts/check-commit-msg.sh "${args[@]}" "$RUNNER_TEMP/msg"; then
              echo "::error::$sha violates the commit policy"; fail=1
            fi
          done
          exit "$fail"
