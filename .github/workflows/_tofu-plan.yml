name: _tofu · plan (reusable)

on:
  workflow_call:
    inputs:
      stack:
        description: "Relative path to the OpenTofu stack (e.g. terraform/github)"
        type: string
        required: true
      pr:
        description: "Pull request that receives the plan comment when not triggered by pull_request (`/plan`)"
        type: string
        required: false
        default: ""
    secrets:
      TF_API_TOKEN:
        required: true
    outputs:
      outcome:
        description: "Plan outcome: success or failure"
        value: ${{ jobs.plan.outputs.outcome }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan · ${{ inputs.stack }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      outcome: ${{ steps.plan.outcome }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # v2.0.0
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # Inputs reach the shell through env, never through template expansion
      # (https://docs.zizmor.sh/audits/#template-injection)
      - name: Format check
        env:
          STACK: ${{ inputs.stack }}
        run: tofu -chdir="$STACK" fmt -check -recursive

      - name: Init
        env:
          STACK: ${{ inputs.stack }}
        run: tofu -chdir="$STACK" init

      - name: Validate
        env:
          STACK: ${{ inputs.stack }}
        run: tofu -chdir="$STACK" validate

      - name: Plan
        id: plan
        env:
          STACK: ${{ inputs.stack }}
        run: tofu -chdir="$STACK" plan -no-color 2>&1 | tee /tmp/plan.txt
        continue-on-error: true

      - name: Post plan comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: github.event_name == 'pull_request' || inputs.pr != ''
        env:
          STACK: ${{ inputs.stack }}
          OUTCOME: ${{ steps.plan.outcome }}
          PR: ${{ inputs.pr }}
        with:
          script: |
            const fs  = require('fs');
            const raw  = fs.readFileSync('/tmp/plan.txt', 'utf8');
            const plan = raw.length > 55000
              ? '...(truncated — see full run)\n' + raw.slice(raw.length - 55000)
              : raw;

            const stack   = process.env.STACK;
            const outcome = process.env.OUTCOME;
            const icon    = outcome === 'success' ? '✅' : '❌';
            const marker  = `<!-- tofu-plan:${stack} -->`;
            // pull_request event, or /plan (workflow_dispatch with the PR number)
            const issue   = context.issue.number || Number(process.env.PR);

            const body = [
              marker,
              `#### ${icon} OpenTofu Plan · \`${stack}\` · \`${outcome}\``,
              '',
              '<details><summary>Show output</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '',
              '</details>',
              '',
              `> [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issue,
            });

            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: issue,
                body,
              });
            }

      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1
