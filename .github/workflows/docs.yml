name: docs

# Check-only: module READMEs are regenerated locally by the terraform-docs pre-commit hook
# (`just docs`). CI never commits, so every commit on main has a single signed human author
# (docs/adr/0002-solo-flow.md).
on:
  pull_request:
    branches: [main]
    paths: ["modules/**", ".terraform-docs.yml"]
  push:
    branches: [main]
    paths: ["modules/**", ".terraform-docs.yml"]

permissions: {}

env:
  TFDOCS_VERSION: "0.25.1" # renovate: datasource=github-releases depName=terraform-docs/terraform-docs

jobs:
  terraform-docs:
    name: terraform-docs up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install terraform-docs (checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base=https://github.com/terraform-docs/terraform-docs/releases/download/v${TFDOCS_VERSION}
          tgz=terraform-docs-v${TFDOCS_VERSION}-linux-amd64.tar.gz
          curl -fsSLO "$base/$tgz"
          curl -fsSL "$base/terraform-docs-v${TFDOCS_VERSION}.sha256sum" | grep " ${tgz}$" | sha256sum -c -
          tar -xzf "$tgz" terraform-docs
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Regenerate and diff
        run: |
          scripts/terraform-docs.sh
          git diff --exit-code -- modules/ || {
            echo "::error::Module docs are stale. Run 'just docs' (or commit with pre-commit installed)."
            exit 1
          }
